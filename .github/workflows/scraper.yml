name: Daily Real Estate Scraper

on:
  schedule:
    # Spouští se každý den o půlnoci (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Umožní ruční spuštění přes GitHub tlačítko

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v3

      - name: Nastavení Pythonu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Spuštění scraperu
        run: python scripts/scrape.py

      - name: Uložení změn do repozitáře
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/projects.json
          git commit -m "Auto-update real estate data" || exit 0
          git push
